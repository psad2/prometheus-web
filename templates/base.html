<!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Prometheus Rising Alliance{% endblock %}</title>
    <style>
        :root{--bg:#0e1319;--panel:#151c24;--line:#26313d;--fg:#e2e8ef;--mut:#8896a5;--acc:#5bb4e5;--gold:#e8a93c;--bad:#ff7a6b}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
        a{color:var(--acc)}
        h1,h2,h3{line-height:1.2;margin:0 0 .6em}
        :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

        nav{display:flex;align-items:center;gap:1.4rem;padding:.8rem clamp(1rem,4vw,2rem);background:var(--panel);border-bottom:1px solid var(--line)}
        nav .brand{font-weight:700;color:var(--fg);text-decoration:none;font-size:1.1rem}
        nav a.l{color:var(--mut);text-decoration:none}nav a.l:hover{color:var(--fg)}
        nav .sp{flex:1}
        nav .pilot{display:flex;align-items:center;gap:.5rem}
        nav .pilot img{width:28px;height:28px;border-radius:50%}

        main{max-width:820px;margin:0 auto;padding:2rem clamp(1rem,4vw,1.5rem) 4rem}
        .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.4rem;margin:1rem 0}

        .btn,button{display:inline-block;font:inherit;font-weight:600;color:#06121c;background:var(--acc);border:0;border-radius:6px;padding:.6rem 1.2rem;cursor:pointer;text-decoration:none}
        .btn:hover,button:hover{filter:brightness(1.1)}
        .btn.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}

        label{display:block;margin:.9rem 0 .25rem;color:var(--mut);font-size:.92rem}
        input,select{width:100%;padding:.6rem .7rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;font:inherit}
        input:focus,select:focus{border-color:var(--acc);outline:none}
        form button{margin-top:1.2rem}
        .err{color:var(--bad)}
        table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
        td,th{padding:.5rem 0;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
        .isk{color:var(--gold)}.total{font-size:2rem;font-weight:700}

        .prose{max-width:70ch}.prose h2{margin-top:1.6em}
        .prose code{background:var(--bg);padding:.1em .35em;border-radius:4px}
        .prose pre{background:var(--bg);padding:1rem;border-radius:6px;overflow-x:auto}
        .prose table td,.prose table th{border:1px solid var(--line);padding:.4rem .7rem;text-align:left}
        .prose img{max-width:100%}

        .hero{padding:3rem 0 2rem}.hero h1{font-size:clamp(2rem,5vw,2.8rem)}
        .hero p{color:var(--mut);max-width:42ch}.hero .acts{display:flex;gap:.7rem;margin-top:1.4rem;flex-wrap:wrap}
        .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
        .tiles .panel{margin:0}.tiles a.panel{display:block;color:var(--fg);text-decoration:none}
        .tiles a.panel:hover{border-color:var(--acc)}.tiles h3{margin-bottom:.3em}.tiles p{margin:0;color:var(--mut);font-size:.95rem}
    </style></head><body>
<nav>
    <a class="brand" href="/">Prometheus</a>
    <a class="l" href="/guides">Guides</a><a class="l" href="/calculator">Logistics</a>
    <span class="sp"></span>
    {% if session.name %}<span class="pilot"><img src="https://images.evetech.net/characters/{{ session.character_id }}/portrait?size=64" alt="">{{ session.name }}</span><a class="l" href="/logout">Log out</a>
    {% else %}<a class="btn" href="/login">Log in with EVE</a>{% endif %}
</nav>
<main>{% block body %}{% endblock %}</main></body></html>
